<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#C8102E" />

    <!-- ─── Telugu Font Support ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- ─── Primary SEO ─── -->
    <title>Nisa Hospital | Trusted Healthcare in Tanuku</title>
    <meta name="description" content="Nisa Hospital in Tanuku provides compassionate healthcare for women, children and eye care, backed by 16 years of trusted healthcare. Call 09885225123." />

    <link rel="icon" type="image/jpeg" href="/nisa-logo.jpg" sizes="any" />
    <link rel="apple-touch-icon" href="/nisa-logo.jpg" />

    <!-- ─── Open Graph ─── -->
    <meta property="og:title" content="Nisa Hospital | Trusted Healthcare in Tanuku" />
    <meta property="og:description" content="Compassionate healthcare for women, children and eye care in Tanuku, backed by 16 years of trusted healthcare." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/nisa-logo.jpg" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:site_name" content="Nisa Hospital" />

    <!-- ─── Twitter / X ─── -->
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:image" content="/nisa-logo.jpg" />

      "image": "/nisa-building.webp",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tanuku",
        "addressRegion": "Andhra Pradesh",

      "hasMap": "https://maps.app.goo.gl/QQS9v6KY2WY4EnKv8",
      "geo": { "@type": "GeoCoordinates", "latitude": 16.756136, "longitude": 81.6827284 },
      "physician": [
        { "@type": "Physician", "name": "Dr. Ayesha Khan Pathan", "medicalSpecialty": ["Obstetrics", "Gynecology"] },
        { "@type": "Physician", "name": "Dr. Rashid Hussain", "medicalSpecialty": "Pediatrics" },
        { "@type": "Physician", "name": "Dr. Hussain Ahmed", "medicalSpecialty": "Ophthalmology" }

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

</html>
